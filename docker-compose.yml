services:
  documents:
    image: larsmikki/documents:latest
    container_name: documents
    ports:
      - "3110:3110"
    environment:
      - PORT=3110
    volumes:
      - /volume2/docker/documents:/app/vault
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3110/api/health"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 90s

